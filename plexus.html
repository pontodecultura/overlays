<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>OBS Plexus Overlay</title>
    <style>
        * { margin: 0; padding: 0; }
        body, html { width: 1920px; height: 1080px; overflow: hidden; background: transparent !important; }
        canvas { display: block; position: absolute; top: 0; left: 0; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="plexusCanvas"></canvas>
    <script>
        const canvas = document.getElementById('plexusCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = 1920; canvas.height = 1080;

        const particles = [];
        const maxParticles = 60; // Quantidade sutil para não cobrir o vídeo
        const connectionDist = 150; // Distância máxima para ligar os pontos

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.radius = Math.random() * 3 + 1;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(0, 240, 255, 0.6)'; // Pontos ciano translúcidos
                ctx.fill();
            }
        }

        for (let i = 0; i < maxParticles; i++) particles.push(new Particle());

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
                particles[i].draw();
                
                for (let j = i + 1; j < particles.length; j++) {
                    const dx = particles[i].x - particles[j].x;
                    const dy = particles[i].y - particles[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);
                    
                    if (dist < connectionDist) {
                        ctx.beginPath();
                        ctx.moveTo(particles[i].x, particles[i].y);
                        ctx.lineTo(particles[j].x, particles[j].y);
                        // A linha fica mais transparente quanto mais longe os pontos estão
                        ctx.strokeStyle = `rgba(0, 240, 255, ${1 - dist / connectionDist - 0.4})`;
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
